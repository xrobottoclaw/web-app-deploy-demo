services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-app:local
    container_name: web-app
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=5000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
